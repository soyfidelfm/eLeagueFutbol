<header class="navbar">

  <div class="navbar-left">
    <div class="brand">
      <img
        src="/images/logo-clear.png"
        alt="eLeague Futbol"
        class="brand-logo" />
    </div>
  </div>

  <nav class="navbar-center">

    <a routerLink="/dashboard" routerLinkActive="active">
      <i class="fa-solid fa-house"></i>
      <span>Dashboard</span>
    </a>

    <a routerLink="/matches" routerLinkActive="active">
      <i class="fa-solid fa-futbol"></i>
      <span>Matches</span>
    </a>

    <a routerLink="/draft" routerLinkActive="active">
      <i class="fa-solid fa-list-ol"></i>
      <span>Draft</span>
    </a>

    <a routerLink="/transfers" routerLinkActive="active">
      <i class="fa-solid fa-right-left"></i>
      <span>Transfers</span>
    </a>

    <a routerLink="/teams" routerLinkActive="active">
      <i class="fa-solid fa-people-group"></i>
      <span>Teams</span>
    </a>

    <a routerLink="/seasons" routerLinkActive="active">
      <i class="fa-solid fa-trophy"></i>
      <span>Seasons & Tournaments</span>
    </a>

    <a routerLink="/clubs" routerLinkActive="active">
      <i class="fa-solid fa-users"></i>
      <span>Clubs</span>
    </a>

    <a routerLink="/rankings" routerLinkActive="active">
      <i class="fa-solid fa-chart-line"></i>
      <span>Rankings</span>
    </a>

    <a routerLink="/stats" routerLinkActive="active">
      <i class="fa-solid fa-chart-simple"></i>
      <span>Stats</span>
    </a>

  </nav>

  <div class="navbar-right">

    <app-message-notifications></app-message-notifications>
    <app-notifications></app-notifications>

    <div
      class="profile-box"
      [class.loading]="!me"
      (click)="me && toggleUserMenu($event)">

      <img
        [src]="me?.avatarUrl || '/images/default-avatar.png'"
        [alt]="me?.displayName || 'User'" />

      <div class="profile-info">
        <strong>{{ me?.displayName || 'Loading...' }}</strong>
        <span>
          {{ me?.gamerTag?.trim() ? me?.gamerTag : (me?.email || 'Profile') }}
        </span>
      </div>

      <div class="online-dot" *ngIf="me"></div>
    </div>

    <div
      class="user-menu"
      *ngIf="showUserMenu"
      (click)="$event.stopPropagation()">

      <button type="button" (click)="openProfileModal($event)">
        <i class="fa-regular fa-user"></i>
        <span>Profile</span>
      </button>

      <button type="button" (click)="logout()">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Sign out</span>
      </button>
    </div>
  </div>
</header>

<div
  class="profile-modal-backdrop"
  *ngIf="showProfileModal"
  (click)="closeProfileModal()">
  <div class="profile-modal-clean" (click)="$event.stopPropagation()">
    <button type="button" class="modal-close" (click)="closeProfileModal()">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <app-profile (saved)="onProfileSaved()"></app-profile>
  </div>
</div>

<div class="toast-success" *ngIf="showToast">
  <i class="fa-solid fa-circle-check"></i>
  <span>{{ toastMessage }}</span>
</div>
