<header class="navbar">

  <!-- LEFT / MOBILE LOGO ONLY -->
  <div class="navbar-left">
    <div class="brand">
      <img
         src="/images/logo-clear.png"
        alt="eLeague Futbol"
        class="brand-logo" />
    </div>
  </div>

  <!-- CENTER -->
  <nav class="navbar-center">

    <a routerLink="/dashboard" routerLinkActive="active">
      <i class="fa-solid fa-house"></i>
      <span>Dashboard</span>
    </a>

    <a routerLink="/matches" routerLinkActive="active">
  <i class="fa-solid fa-futbol"></i>
  <span>Matches</span>
</a>

    <a routerLink="/seasons" routerLinkActive="active">
      <i class="fa-solid fa-trophy"></i>
      <span>Seasons & Tournaments</span>
    </a>

    <a routerLink="/clubs" routerLinkActive="active">
      <i class="fa-solid fa-users"></i>
      <span>Clubs</span>
    </a>

    <a routerLink="/rankings" routerLinkActive="active">
      <i class="fa-solid fa-chart-line"></i>
      <span>Rankings</span>
    </a>

    <a routerLink="/stats" routerLinkActive="active">
      <i class="fa-solid fa-chart-simple"></i>
      <span>Stats</span>
    </a>

  </nav>

  <!-- RIGHT -->
  <div class="navbar-right">

    <button class="icon-btn">
      <i class="fa-regular fa-bell"></i>
      <span class="notification-dot">3</span>
    </button>

    <!-- USER -->
    <div
  class="profile-box"
  [class.loading]="!me"
  (click)="me && toggleUserMenu($event)">

      <img
  [src]="me?.avatarUrl || '/images/default-avatar.png'"
  [alt]="me?.displayName || 'User'" />

<div class="profile-info">
  <strong>{{ me?.displayName || 'Loading...' }}</strong>

  <span>
    {{ me?.gamerTag?.trim() ? me?.gamerTag : (me?.email || 'Profile') }}
  </span>
</div>

<div class="online-dot" *ngIf="me"></div>

    </div>

    <!-- USER MENU -->
    <div
      class="user-menu"
      *ngIf="showUserMenu"
      (click)="$event.stopPropagation()">

      <button
        type="button"
        (click)="openProfileModal($event)">
        <i class="fa-regular fa-user"></i>
        <span>Profile</span>
      </button>

      <button
        type="button"
        (click)="logout()">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Sign out</span>
      </button>

    </div>

  </div>

</header>

<!-- PROFILE POPUP -->
<div
  class="profile-modal-backdrop"
  *ngIf="showProfileModal"
  (click)="closeProfileModal()">

  <div
    class="profile-modal-clean"
    (click)="$event.stopPropagation()">

    <button
      type="button"
      class="modal-close"
      (click)="closeProfileModal()">
      <i class="fa-solid fa-xmark"></i>
    </button>

    <app-profile
      (saved)="onProfileSaved()">
    </app-profile>

  </div>

</div>

<!-- TOAST -->
<div
  class="toast-success"
  *ngIf="showToast">

  <i class="fa-solid fa-circle-check"></i>
  <span>{{ toastMessage }}</span>

</div>
