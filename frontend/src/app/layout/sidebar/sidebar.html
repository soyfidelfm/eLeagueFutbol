<aside class="sidebar">

  <div class="sidebar-top">
    <div class="sidebar-logo">
      <img src="/images/logo-clear.png" alt="logo" />
    </div>
  </div>

  <div class="sidebar-bottom">

    <div class="season-card">

      <span class="season-label">
        {{ sidebarData?.season?.label || ('CURRENT SEASON' | t) }}
      </span>

      <h3>{{ sidebarData?.season?.name || ('No Season' | t) }}</h3>

      <div class="season-rank">
        <span>{{ sidebarData?.season?.totalClubs || 0 }}</span>
      </div>

      <small>{{ 'REGISTERED CLUBS' | t }}</small>

      <div class="season-stats">
        <div>
          <strong>{{ sidebarData?.season?.totalMatches || 0 }}</strong>
          <span>{{ 'MATCHES' | t }}</span>
        </div>
      </div>

      <button routerLink="/seasons" [queryParams]="{ view: 'current' }">
        {{ 'View Season' | t }}
      </button>

    </div>

  </div>

</aside>
