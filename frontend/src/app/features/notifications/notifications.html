<div class="notifications-wrapper">
  <button
    type="button"
    class="notification-button"
    (click)="toggleDropdown()">

    <i class="fa-solid fa-bell"></i>

    <span
      *ngIf="unreadCount > 0"
      class="notification-badge">
      {{ unreadCount > 99 ? '99+' : unreadCount }}
    </span>
  </button>

  <div
    class="notifications-dropdown"
    *ngIf="isOpen">

    <div class="notifications-header">
      <div>
        <h3>{{ 'Notifications' | t }}</h3>
        <span>{{ unreadCount }} {{ 'unread' | t }}</span>
      </div>

      <button
        type="button"
        *ngIf="unreadCount > 0"
        (click)="markAllAsRead($event)">
        {{ 'Mark all read' | t }}
      </button>
    </div>

    <div class="notifications-loading" *ngIf="isLoading">
      <i class="fa-solid fa-spinner fa-spin"></i>
      <span>{{ 'Loading...' | t }}</span>
    </div>

    <app-empty-state
      *ngIf="!isLoading && notifications.length === 0"
      [compact]="true"
      icon="fa-regular fa-bell"
      title="No notifications yet"
      description="Draft turns, offers and results will appear here.">
    </app-empty-state>

    <div
      class="notification-list"
      *ngIf="!isLoading && notifications.length > 0">

      <button
        type="button"
        class="notification-item"
        *ngFor="let item of notifications"
        [class.unread]="!item.isRead"
        (click)="openNotification(item)">

        <div class="notification-icon">
          <i [class]="center.iconFor(item.type)"></i>
        </div>

        <div class="notification-content">
          <div class="notification-title-row">
            <h4>{{ item.title }}</h4>

            <span
              class="unread-dot"
              *ngIf="!item.isRead">
            </span>
          </div>

          <p>{{ item.message }}</p>

          <small [title]="item.createdAtUTC | tdate:'medium'">
            {{ center.relativeTime(item.createdAtUTC) || (item.createdAtUTC | tdate:'short') }}
          </small>
        </div>
      </button>
    </div>

    <a class="view-all" routerLink="/notifications" (click)="closeDropdown()">
      {{ 'View all' | t }} <i class="fa-solid fa-arrow-right"></i>
    </a>
  </div>

  <div
    class="notifications-backdrop"
    *ngIf="isOpen"
    (click)="closeDropdown()">
  </div>
</div>
