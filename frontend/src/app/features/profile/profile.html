<section class="profile-page">
  <div class="profile-card">

    <div class="profile-header">
      <div class="profile-title">
        <span class="eyebrow">{{ 'PLAYER SETTINGS' | t }}</span>

        <h2>{{ 'My Profile' | t }}</h2>

        <p class="subtitle">
          {{ 'Customize your eLeagueFutbol identity.' | t }}
        </p>
      </div>

      <div class="avatar-block">
        <div class="avatar-preview">
          <img
            *ngIf="showAvatarImage"
            [src]="form.avatarUrl"
            [alt]="'Avatar' | t"
            referrerpolicy="no-referrer"
            (error)="onAvatarError()" />

          <span *ngIf="!showAvatarImage" class="avatar-initials" aria-hidden="true">
            {{ avatarInitials }}
          </span>

          <span *ngIf="isUploadingAvatar" class="avatar-uploading">
            <i class="fa-solid fa-circle-notch fa-spin"></i>
          </span>
        </div>

        <input
          #avatarInput
          type="file"
          accept="image/*"
          hidden
          [disabled]="isUploadingAvatar"
          (change)="onAvatarSelected($event)" />

        <button
          *ngIf="user"
          type="button"
          class="avatar-change-btn"
          [disabled]="isUploadingAvatar"
          (click)="avatarInput.click()">
          <i
            class="fa-solid"
            [ngClass]="isUploadingAvatar ? 'fa-circle-notch fa-spin' : 'fa-camera'">
          </i>
          <span>
            {{ isUploadingAvatar ? ('Uploading Avatar...' | t) : ('Change Avatar' | t) }}
          </span>
        </button>
      </div>
    </div>

    <div *ngIf="isLoading" class="message">
      <i class="fa-solid fa-circle-notch fa-spin"></i>
      <span>{{ 'Loading profile...' | t }}</span>
    </div>

    <div *ngIf="!isLoading && errorMessage" class="error">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <span>{{ errorMessage | t }}</span>
    </div>

    <div *ngIf="!isLoading && successMessage" class="success">
      <i class="fa-solid fa-circle-check"></i>
      <span>{{ successMessage | t }}</span>
    </div>

    <form *ngIf="!isLoading && user" (ngSubmit)="save()">

      <label class="full-width">
        <span>
          <i class="fa-regular fa-user"></i>
          {{ 'Display Name' | t }}
        </span>

        <input
          type="text"
          name="displayName"
          [(ngModel)]="form.displayName"
          autocomplete="name"
          [placeholder]="'Enter your player name' | t" />
      </label>

      <div class="team-selection-grid full-width">

        <label>
          <span>
            <i class="fa-solid fa-trophy"></i>
            {{ 'League' | t }}
          </span>

          <mat-form-field class="profile-select" appearance="outline">
            <input
              type="text"
              matInput
              #leagueTrigger="matAutocompleteTrigger"
              name="leagueSearch"
              [(ngModel)]="leagueSearchText"
              (ngModelChange)="filterLeagues()"
              [matAutocomplete]="leagueAuto"
              [placeholder]="'Search league' | t" />

            <mat-autocomplete
              #leagueAuto="matAutocomplete"
              (optionSelected)="selectLeague($event.option.value)">

              <mat-option
                *ngFor="let league of filteredLeagues"
                [value]="league">
                {{ league }}
              </mat-option>

            </mat-autocomplete>
          </mat-form-field>
        </label>

        <label>
          <span>
            <i class="fa-solid fa-shield-halved"></i>
            {{ 'Team' | t }}
          </span>

          <mat-form-field class="profile-select" appearance="outline">
            <input
              type="text"
              matInput
              #teamTrigger="matAutocompleteTrigger"
              name="teamSearch"
              [(ngModel)]="teamSearchText"
              (ngModelChange)="filterTeams()"
              [matAutocomplete]="teamAuto"
              [disabled]="!selectedLeague"
              [placeholder]="'Search team' | t" />

            <mat-autocomplete
              #teamAuto="matAutocomplete"
              [displayWith]="displayTeamName"
              (optionSelected)="selectTeam($event.option.value)">

              <mat-option
                *ngFor="let club of filteredGameClubs"
                [value]="club">
                {{ club.name }}
              </mat-option>

            </mat-autocomplete>
          </mat-form-field>
        </label>

      </div>

      <label>
        <span>
          <i class="fa-solid fa-futbol"></i>
          {{ 'Club Name' | t }}
        </span>

        <input
          type="text"
          name="clubName"
          [(ngModel)]="form.clubName"
          autocomplete="off"
          [placeholder]="'Enter your club name' | t" />
      </label>

      <label>
        <span>
          <i class="fa-solid fa-gamepad"></i>
          {{ 'PS ID / Gamertag' | t }}
        </span>

        <input
          type="text"
          name="gamerTag"
          [(ngModel)]="form.gamerTag"
          autocomplete="off"
          [placeholder]="'Enter your PS ID or Gamertag' | t" />
      </label>

      <button
        class="btn-primary full-width"
        type="submit"
        [disabled]="isSaving || isUploadingAvatar">

        <i
          class="fa-solid"
          [ngClass]="isSaving ? 'fa-circle-notch fa-spin' : 'fa-floppy-disk'">
        </i>

        <span>
          {{ isSaving ? ('Saving profile...' | t) : ('Save Changes' | t) }}
        </span>
      </button>

    </form>

  </div>
</section>
